#claude
[package]
name = "citron_v2"
version = "2.5.0"
edition = "2024"

[dependencies]
eframe = { version = "0.34.3", features = ["persistence"] }
egui_extras = { version = "0.34", features = ["svg"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
rfd = "0.17.2"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "wav"] }
serde = { version = "1", features = ["derive"] }
tray-icon = "0.24.1"

objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSGeometry", "objc2-core-foundation"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication", "NSApplication", "NSResponder", "NSWindow", "NSView", "NSButton", "NSControl", "objc2-core-foundation"] }
